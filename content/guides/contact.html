<main class="guide-page contact-page">
<section class="guide-intro paper contact-intro">
<p class="eyebrow">CONTACT</p>
<h1>お問い合わせ</h1>
<p class="lead">ワークショップ参加者向けのお問い合わせページです。</p>
</section>
<section class="contact-panel paper" aria-labelledby="form-heading">
<h2 id="form-heading">お問い合わせ内容</h2>
<p id="contact-status" class="contact-status">{{ contact-status }} 入力・送信はまだできません。</p>
<details class="form-preview"><summary>受付開始後の入力項目を見る（見本）</summary>
<!-- 受付開始時に送信先・個人情報の取り扱いを設定し、送信処理を接続する。 -->
<form aria-describedby="contact-status">
<fieldset disabled><legend>お問い合わせフォームの見本</legend>
<div class="contact-field">
<label for="contact-name">お名前 <span class="required-label">必須</span>
</label>
<input id="contact-name" name="name" autocomplete="name" maxlength="100" required />
</div>
<div class="contact-field">
<label for="contact-email">返信先メールアドレス <span class="required-label">必須</span>
</label>
<input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required />
</div>
<div class="contact-field">
<label for="contact-event">参加したイベント・会場 <span class="optional-label">任意</span>
</label>
<p class="field-help" id="event-help">イベント名や会場名など、分かる範囲でご記入ください。</p>
<input id="contact-event" name="event" maxlength="200" aria-describedby="event-help" />
</div>
<div class="contact-field">
<label for="contact-date">参加日 <span class="optional-label">任意</span>
</label>
<input id="contact-date" name="event_date" type="date" />
</div>
<div class="contact-field">
<label for="contact-message">ご質問・ご相談 <span class="required-label">必須</span>
</label>
<p class="field-help" id="message-help">甲虫の種類や、どの作業で困っているかなどをお書きください。種類が分からない場合は、分かる範囲で構いません。</p>
<textarea id="contact-message" name="message" rows="8" maxlength="5000" required aria-describedby="message-help">
</textarea>
</div>
<button class="button contact-submit" type="submit" disabled>送信する（受付準備中）</button>
</fieldset>
</form>
</details>
<p><a href="beginner.html#help">作業中の困りごとを確認する →</a></p>
</section>
</main>
