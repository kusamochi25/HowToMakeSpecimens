<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="昆虫標本ワークショップに関するお問い合わせフォームです。" />
    <title>お問い合わせ｜昆虫標本ガイド</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="site-nav.css" />
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html"><span>BOOM INSECT</span><strong>昆虫標本ガイド</strong></a><a class="guide-index-link" href="index.html#choose-guide"><span aria-hidden="true">←</span><span>ガイド一覧へ</span></a></header>
    <main class="guide-page contact-page">
      <section class="guide-intro paper contact-intro">
        <p class="eyebrow">CONTACT</p>
        <h1>お問い合わせ</h1>
        <p class="lead">ワークショップに参加された方の、標本制作に関するご質問を受け付けるフォームです。</p>
      </section>
      <section class="contact-panel paper" aria-labelledby="form-heading">
        <h2 id="form-heading">お問い合わせ内容</h2>
        <p id="contact-status" class="contact-status">現在、受付準備中です。このフォームからはまだ送信できません。</p>
        <p class="field-guide">「必須」の項目を入力してください。</p>
        <!-- 受付開始時に送信先・個人情報の取り扱いを設定し、送信処理を接続する。 -->
        <form aria-describedby="contact-status" onsubmit="event.preventDefault()">
          <div class="contact-field">
            <label for="contact-name">お名前 <span class="required-label">必須</span></label>
            <input id="contact-name" name="name" autocomplete="name" maxlength="100" required />
          </div>
          <div class="contact-field">
            <label for="contact-email">返信先メールアドレス <span class="required-label">必須</span></label>
            <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          </div>
          <div class="contact-field">
            <label for="contact-event">参加したイベント・会場 <span class="optional-label">任意</span></label>
            <p class="field-help" id="event-help">イベント名や会場名など、分かる範囲でご記入ください。</p>
            <input id="contact-event" name="event" maxlength="200" aria-describedby="event-help" />
          </div>
          <div class="contact-field">
            <label for="contact-date">参加日 <span class="optional-label">任意</span></label>
            <input id="contact-date" name="event_date" type="date" />
          </div>
          <div class="contact-field">
            <label for="contact-message">ご質問・ご相談 <span class="required-label">必須</span></label>
            <p class="field-help" id="message-help">甲虫の種類や、どの作業で困っているかなどをお書きください。種類が分からない場合は、分かる範囲で構いません。</p>
            <textarea id="contact-message" name="message" rows="8" maxlength="5000" required aria-describedby="message-help"></textarea>
          </div>
          <button class="button contact-submit" type="submit" disabled>送信する（受付準備中）</button>
        </form>
      </section>
    </main>
    <footer class="site-footer"><p><strong>BOOM INSECT</strong>｜昆虫標本ガイド</p></footer>
  </body>
</html>
